name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  python:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest

  worker:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config \
            libgrpc++-dev libprotobuf-dev protobuf-compiler protobuf-compiler-grpc \
            libavahi-compat-libdnssd-dev avahi-daemon
          sudo systemctl start avahi-daemon
      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja grpc protobuf
      - name: Configure
        working-directory: worker
        run: cmake --preset cpu
      - name: Build
        working-directory: worker
        run: cmake --build --preset cpu
      - name: Unit tests
        working-directory: worker
        env:
          SHARDLINE_REQUIRE_MDNS: "1"
        run: ctest --preset cpu
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Python against the built worker
        env:
          SHARDLINE_WORKER_BIN: ${{ github.workspace }}/worker/build/cpu/shardline-worker
        run: |
          uv sync --locked
          uv run pytest tests/test_worker_integration.py

  worker-cuda:
    # Compiles the CUDA device probe; hosted runners have no GPU, so the
    # probe reports no CUDA devices at test time.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container: nvidia/cuda:12.8.1-devel-ubuntu24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            cmake ninja-build g++ pkg-config \
            libgrpc++-dev libprotobuf-dev protobuf-compiler protobuf-compiler-grpc \
            libavahi-compat-libdnssd-dev
      - name: Configure
        working-directory: worker
        run: cmake --preset cuda
      - name: Build
        working-directory: worker
        run: cmake --build --preset cuda
      - name: Unit tests
        working-directory: worker
        run: ctest --preset cuda

  proto:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          setup_only: true
      - run: buf lint
      - run: buf format --diff --exit-code
      - name: Breaking changes
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
        run: |
          # The check starts once the comparison base contains buf.yaml.
          if git cat-file -e "$BASE:buf.yaml" 2>/dev/null; then
            buf breaking --against ".git#ref=$(git rev-parse "$BASE")"
          else
            echo "$BASE has no buf.yaml; no protocol baseline to compare against yet"
          fi
