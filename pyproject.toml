[build-system]
requires = ["hatchling>=1.27", "grpcio-tools==1.85.1"]
build-backend = "hatchling.build"

[project]
name = "shardline"
version = "0.1.0.dev0"
description = "Pipeline-parallel LLM serving across mixed NVIDIA and Apple Silicon machines on a LAN"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Vishesh Rawal" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: System :: Distributed Computing",
]
dependencies = [
  "grpcio>=1.85.1",
  "protobuf>=7.35.1,<8",
  "zeroconf>=0.140",
]

[project.optional-dependencies]
oracle = ["torch>=2.6", "transformers>=4.50"]

[project.urls]
Homepage = "https://github.com/visheshrwl/shardline"
Issues = "https://github.com/visheshrwl/shardline/issues"
Source = "https://github.com/visheshrwl/shardline"

[project.scripts]
shardline = "shardline.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.12"]

[tool.hatch.build.targets.wheel]
packages = ["python/shardline"]
artifacts = ["python/shardline/v1/*_pb2*.py", "python/shardline/v1/*_pb2*.pyi"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["/python/shardline", "/proto", "/hatch_build.py", "/tests", "/README.md", "/LICENSE"]
exclude = ["python/shardline/v1/*_pb2*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
xfail_strict = true

[tool.ruff]
line-length = 100
src = ["python", "tests"]
include = ["python/**/*.py", "tests/**/*.py", "hatch_build.py"]
target-version = "py311"
extend-exclude = ["python/shardline/v1/*_pb2*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["shardline"]
